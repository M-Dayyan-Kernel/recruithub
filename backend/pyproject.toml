[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "backend"
version = "0.1.0"
description = "AI Recruitment Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.13.2",
    "asyncpg==0.29.0",
    "bleach>=6.2.0",
    "boto3>=1.43.49",
    "celery[redis]==5.4.0",
    "cryptography>=49.0.0",
    "fastapi==0.111.0",
    "google-api-python-client>=2.130.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.29.0",
    "httpx==0.27.0",
    "jose>=1.0.0",
    "livekit-agents[openai]>=1.6.2",
    "livekit-api>=0.7.0",
    "openai>=2.36.0,<3.0.0",
    "passlib>=1.7.4",
    "prometheus-client>=0.21.0",
    "pydantic-settings==2.3.4",
    "pyotp>=2.9.0",
    "pymupdf==1.24.5",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "pyyaml>=6.0.3",
    "redis==5.0.7",
    "sentry-sdk>=2.19.0",
    "sqlalchemy[asyncio]==2.0.31",
    "uvicorn[standard]==0.30.1",
    "psycopg2>=2.9.12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
