# Server 1: API + frontends (+ interview agent). Requires .env.production
# (non-secrets only) + seed.env (gitignored secrets, openbao-only).

services:
  # OpenBao (central secrets manager). Self-provisions on first boot
  # (init/unseal/KV v2/policy/secrets/app token -- see openbao/entrypoint.sh).
  # Seeded from seed.env (the openbao container is the ONLY service that ever
  # receives the secret values as env. api/workers/agent fetch them from OpenBao.
  openbao:
    build: ./openbao
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"   # host-local admin access only
    env_file:
      - seed.env
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - bao-data:/bao/data       # encrypted secrets at rest
      - ./.bao-shared:/shared       # scoped app token (rh.token) only
      - ./.bao-keys:/bao-keys    # unseal key + root token (root-only host dir)
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared/.bao-ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      # Secrets are read from OpenBao at startup via the scoped token.
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /shared/rh.token
      BAO_REQUIRED: "true"
    depends_on:
      openbao:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Nested JSON logs (events/errors/http) to host ./backend/logs
      - ./backend/logs:/app/logs
      - ./.bao-shared:/shared:ro
    restart: unless-stopped

  hr-app:
    build:
      context: ./hr-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    restart: unless-stopped

  candidate-app:
    build:
      context: ./candidate-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5174:80"
    restart: unless-stopped

  interview-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python interview_agent.py start
    env_file:
      - .env.production
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /shared/rh.token
      BAO_REQUIRED: "true"
    depends_on:
      openbao:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.bao-shared:/shared:ro
    profiles:
      - interviews
    restart: unless-stopped

volumes:
  bao-data:
