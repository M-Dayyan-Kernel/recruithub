# Server 1: API + frontends (+ interview agent). Requires .env.production
# (non-secrets only) + seed.env (gitignored secrets, openbao-only).

services:
  # OpenBao (central secrets manager). Self-provisions on first boot
  # (init/unseal/KV v2/policy/secrets/app token) �?" see openbao/entrypoint.sh.
  # Seeded from seed.env — the openbao container is the ONLY service that ever
  # receives the secret values as env. api/workers/agent fetch them from OpenBao.
  openbao:
    build: ./openbao
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"   # host-local admin access only
    env_file:
      - seed.env
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - bao-data:/bao/data       # encrypted secrets at rest
      - bao-shared:/shared       # scoped app token (rh.token) only
      - ./.bao-keys:/bao-keys    # unseal key + root token (root-only host dir)
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared/.bao-ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.production
    environment:
      # Secrets are read from OpenBao at startup via the scoped token.
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /shared/rh.token
      BAO_REQUIRED: "true"
    depends_on:
      openbao:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      # Nested JSON logs (events/errors/http) → host ./backend/logs
      - ./backend/logs:/app/logs
      - bao-shared:/shared:ro
    restart: unless-stopped

  # Gateway nginx (mirrors talentOS proxy): public TLS front door on 80/443.
  #   /v1/*                 -> OpenBao API (IP allowlist) for local dev machines
  #   /bao-token/rh.token   -> scoped app token (basic-auth + IP allowlist)
  #   everything else       -> api:8000 (so re-pointing the LB to :443 keeps the
  #                            API working). Server services use the docker
  #                            network (BAO_ADDR=http://openbao:8200), NOT this.
  # Requires ./.bao-htpasswd + ./.bao-allowlist.conf (generated by deploy.sh
  # from BAO_TOKEN_USER/PASS/ALLOWED_IPS) and Let's Encrypt certs.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - bao-shared:/shared:ro
      - ./.bao-htpasswd:/etc/nginx/conf.d/.bao-htpasswd:ro
      - ./.bao-allowlist.conf:/etc/nginx/conf.d/.bao-allowlist.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      openbao:
        condition: service_healthy
      api:
        condition: service_started

  hr-app:
    build:
      context: ./hr-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    restart: unless-stopped

  candidate-app:
    build:
      context: ./candidate-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5174:80"
    restart: unless-stopped

  interview-agent:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: python interview_agent.py start
    env_file:
      - .env.production
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN_FILE: /shared/rh.token
      BAO_REQUIRED: "true"
    depends_on:
      openbao:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bao-shared:/shared:ro
    profiles:
      - interviews
    restart: unless-stopped

volumes:
  bao-data:
  bao-shared:
