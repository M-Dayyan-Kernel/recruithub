# Local-only overrides:
#  - shared local-disk resume upload volume between api and celery-resume
#    workers (production always uses S3, so this has no prod equivalent)
#  - remapped host ports: 5173/5174/8000 collide with another app already
#    running natively on this machine (a Vite dev server + a Python
#    backend, both predating this stack)

services:
  api:
    ports: !override
      - "8010:8000"
    volumes:
      - local_uploads:/app/uploads

  hr-app:
    ports: !override
      - "5183:80"

  candidate-app:
    ports: !override
      - "5184:80"

  celery-resume-1:
    volumes:
      - local_uploads:/app/uploads

  celery-resume-2:
    volumes:
      - local_uploads:/app/uploads

  celery-resume-3:
    volumes:
      - local_uploads:/app/uploads

volumes:
  local_uploads:
