server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Served as plain files. Without this the SPA fallback below would answer a missing
    # zip with index.html (HTTP 200), and a candidate would download a web page named
    # .zip. no-cache so a redeployed extension is never served stale from a cache.
    location /extension/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
