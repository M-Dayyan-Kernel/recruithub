# ── recruithub OpenBao gateway (mirrors talentOS proxy) ─────────────────────
# Public TLS front door on Server 1 (api.recruithub.webknot-dev.in).
#
#   /v1/*               → OpenBao API — used by local dev machines only
#                         (IP-restricted via .bao-allowlist.conf). Server
#                         services reach OpenBao over the docker network
#                         (BAO_ADDR=http://openbao:8200), NOT this route.
#   /bao-token/rh.token → scoped app token for local dev — IP-restricted AND
#                         basic-auth protected (served from the bao-shared
#                         volume).
#   everything else     → api:8000, so the API keeps working after the LB is
#                         re-pointed to :443 (nginx fronts the backend, like
#                         talentOS).
#
# .bao-allowlist.conf + .bao-htpasswd are generated by deploy.sh from
# BAO_TOKEN_ALLOWED_IPS / BAO_TOKEN_USER / BAO_TOKEN_PASS.

server {
    listen 80;
    server_name api.recruithub.webknot-dev.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.recruithub.webknot-dev.in;
    client_max_body_size 10M;

    ssl_certificate     /etc/letsencrypt/live/api.recruithub.webknot-dev.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.recruithub.webknot-dev.in/privkey.pem;

    location /v1/ {
        include /etc/nginx/conf.d/.bao-allowlist.conf;
        proxy_pass http://openbao:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bao-token/rh.token {
        auth_basic "recruithub OpenBao app token";
        auth_basic_user_file /etc/nginx/conf.d/.bao-htpasswd;
        include /etc/nginx/conf.d/.bao-allowlist.conf;
        alias /shared/rh.token;
        default_type text/plain;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
